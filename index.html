<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Global toast system
        let _globalToast = null;
        function showToast(message, type = 'success') { if (_globalToast) _globalToast(message, type); }

        function ToastContainer() {
            const [toasts, setToasts] = useState([]);
            useEffect(() => {
                _globalToast = (message, type) => {
                    const id = Date.now() + Math.random();
                    setToasts(prev => [...prev, { id, message, type }]);
                    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
                };
                return () => { _globalToast = null; };
            }, []);
            const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
            if (toasts.length === 0) return null;
            return ReactDOM.createPortal(
                <div className="toast-wrapper">
                    {toasts.map(t => (
                        <div key={t.id} className={`toast toast-${t.type}`}>
                            <span style={{fontSize: '1.1em'}}>{icons[t.type] || '✓'}</span>
                            <span>{t.message}</span>
                        </div>
                    ))}
                </div>,
                document.body
            );
        }

        const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
        const isRecurringTransaction = (t) =>
            t.isRecurring === true ||
            (t.description && (t.description.endsWith('(Recurring)') || t.description.endsWith('(Auto)')));

        const getWeeksInRange = (rangeStart, rangeEnd) => {
            const weeks = [];
            const first = new Date(rangeStart);
            first.setDate(first.getDate() - first.getDay()); // back to Sunday
            first.setHours(0,0,0,0);
            let cur = new Date(first);
            while (cur <= rangeEnd) {
                const wEnd = new Date(cur); wEnd.setDate(cur.getDate() + 6); wEnd.setHours(23,59,59,999);
                weeks.push({
                    weekStart: new Date(cur),
                    weekEnd: new Date(wEnd),
                    effectiveStart: new Date(Math.max(cur.getTime(), rangeStart.getTime())),
                    effectiveEnd:   new Date(Math.min(wEnd.getTime(), rangeEnd.getTime()))
                });
                cur.setDate(cur.getDate() + 7);
            }
            return weeks;
        };
        const parseLocalDate = (dateStr) => { const [year, month, day] = dateStr.split('-').map(Number); return new Date(year, month - 1, day); };
        const formatDate = (dateStr) => { const date = parseLocalDate(dateStr); return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
        const getLocalDateString = (date = new Date()) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        const getCurrentFinancialMonth = () => { const today = new Date(); const day = today.getDate(); const month = today.getMonth(); const year = today.getFullYear(); if (day >= 28) { return new Date(year, month + 1, 1); } else { return new Date(year, month, 1); } };
        const getFinancialMonthRange = (date) => { const month = date.getMonth(); const year = date.getFullYear(); const start = new Date(year, month - 1, 28); const end = new Date(year, month, 27, 23, 59, 59); return { start, end }; };
        const getMonthKey = (date) => { const d = new Date(date); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };

        function FinanceTracker() {
            // Predefined categories
            const expenseCategories = ['Food', 'Groceries', 'Coffee', 'Subscriptions', 'Home', 'Car Payments', 'Personal', 'Pets', 'Utilities', 'Gas (cars)', 'Debt', 'Insurance', 'Kids', 'Savings', 'House cleaning', 'Entertainment', 'Healthcare', 'Transportation', 'Other'];
            const incomeCategories = ['Salary', 'Freelance', 'Investment', 'Gift', 'Bonus', 'Refund', 'Other'];
            
            const [activeTab, setActiveTab] = useState('dashboard');
            const [transactions, setTransactions] = useState([]);
            const [recurringPayments, setRecurringPayments] = useState([]);
            const [debts, setDebts] = useState([]);
            const [paidPayments, setPaidPayments] = useState({});
            const [currentMonth, setCurrentMonth] = useState(getCurrentFinancialMonth());
            const [expectedMonthlyIncome, setExpectedMonthlyIncome] = useState(5000);
            const [dataLoaded, setDataLoaded] = useState(false);
            const [weeklySpendingBudget, setWeeklySpendingBudget] = useState(580);
            const [ignoredDuplicatePairs, setIgnoredDuplicatePairs] = useState(new Set());

            // No browser storage — data lives only for this session
            useEffect(() => {
                setDataLoaded(true);
            }, []);

            // Auto-process recurring payments when their due date passes
            useEffect(() => {
                const timer = setTimeout(() => {
                    if (recurringPayments.length === 0) return;
                    const hasLinkedPayments = recurringPayments.some(p => p.linkedDebt);
                    if (hasLinkedPayments && debts.length === 0) return;

                    const monthKey = getMonthKey(currentMonth);
                    const todayDate = new Date();
                    const __range = getFinancialMonthRange(currentMonth); const start = __range.start;

                    let newTransactions = [...transactions];
                    let updatedDebts = [...debts];
                    let hasTransactionChanges = false;
                    let hasDebtChanges = false;

                    recurringPayments.forEach(payment => {
                        if (!payment.auto) return;

                        let paymentDate;
                        if (payment.dueDay >= 28) {
                            paymentDate = new Date(start.getFullYear(), start.getMonth(), payment.dueDay);
                        } else {
                            paymentDate = new Date(start.getFullYear(), start.getMonth() + 1, payment.dueDay);
                        }

                        if (todayDate >= paymentDate) {
                            const paymentKey = `${monthKey}-${payment.id}`;
                            const transactionExists = newTransactions.some(t => {
                                if (t.type !== 'expense') return false;
                                const tDate = parseLocalDate(t.date);
                                const endDate = new Date(start.getFullYear(), start.getMonth() + 1, 27);
                                if (tDate < start || tDate > endDate) return false;
                                if (Math.abs(parseFloat(t.amount) - parseFloat(payment.amount)) > 0.01) return false;
                                const descMatch = t.description.toLowerCase().includes(payment.name.toLowerCase());
                                const catMatch = payment.category && t.category && t.category.toLowerCase() === payment.category.toLowerCase();
                                return descMatch || catMatch;
                            });

                            if (!transactionExists) {
                                const newTransaction = {
                                    type: 'expense',
                                    amount: parseFloat(payment.amount),
                                    description: `${payment.name} (Auto)`,
                                    category: payment.category,
                                    date: getLocalDateString(paymentDate),
                                    id: Date.now() + Math.random(),
                                    isRecurring: true
                                };
                                newTransactions.push(newTransaction);
                                hasTransactionChanges = true;

                                if (payment.linkedDebt) {
                                    const linkedDebtId = parseInt(payment.linkedDebt);
                                    const linkedDebtIndex = updatedDebts.findIndex(d => d.id === linkedDebtId);
                                    if (linkedDebtIndex !== -1) {
                                        const debt = updatedDebts[linkedDebtIndex];
                                        const paymentAmount = parseFloat(payment.amount);
                                        const monthlyInterestRate = (parseFloat(debt.interestRate) || 0) / 100 / 12;
                                        const interestAccrued = debt.currentBalance * monthlyInterestRate;
                                        const principalPaid = paymentAmount - interestAccrued;
                                        const newBalance = Math.max(0, debt.currentBalance - principalPaid);
                                        const logEntry = {
                                            date: getLocalDateString(paymentDate),
                                            paymentAmount, interestAccrued, principalPaid,
                                            balanceBefore: debt.currentBalance, balanceAfter: newBalance
                                        };
                                        updatedDebts[linkedDebtIndex] = {
                                            ...debt,
                                            currentBalance: newBalance,
                                            transactionLog: [...(debt.transactionLog || []), logEntry],
                                            lastUpdated: getLocalDateString(paymentDate)
                                        };
                                        hasDebtChanges = true;
                                    }
                                }
                            }

                            setPaidPayments(prevPaid => prevPaid[paymentKey] ? prevPaid : {...prevPaid, [paymentKey]: true});
                        }
                    });

                    if (hasTransactionChanges) setTransactions(newTransactions);
                    if (hasDebtChanges) setDebts(updatedDebts);
                }, 500);

                return () => clearTimeout(timer);
            }, [currentMonth, recurringPayments.length, debts.length]);

                const expenses = monthlyTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + parseFloat(t.amount), 0);
                
                // Total Expenses = ONLY transactions (recurring payments are handled separately)

        function DashboardTab({ totals, totalDebt, unpaidRecurring, currentMonth, transactions, setTransactions, recurringPayments, debts, setDebts, expectedMonthlyIncome, importData, paidPayments, setPaidPayments, weeklySpendingBudget }) {
            const [debtsCollapsed, setDebtsCollapsed] = useState(false);

            const fileInputRef = React.useRef(null); // Move ref to top level
            const monthName = currentMonth.toLocaleString('default', { month: 'long', year: 'numeric' });
            const __range = getFinancialMonthRange(currentMonth); const start = __range.start; const end = __range.end;
            
            // Simple Money Available calculation
            // Income - Recurring = Money Left
            const recurringTotal = recurringPayments
                .filter(p => {
                    let paymentDate;
                    if (p.dueDay >= 28) {
                        paymentDate = new Date(start.getFullYear(), start.getMonth(), p.dueDay);
                    } else {
                        paymentDate = new Date(start.getFullYear(), start.getMonth() + 1, p.dueDay);
                    }
                    return paymentDate >= start && paymentDate <= end;
                })
                .reduce((sum, p) => sum + parseFloat(p.amount), 0);
            
            // Recurring paid so far = total recurring this month minus what's still outstanding
            const paidRecurringTotal = recurringTotal - unpaidRecurring;
            
            const billsDueSoon = (() => {
                const today = new Date();
                const todayMs = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
                const monthKey = getMonthKey(currentMonth);
                const __range = getFinancialMonthRange(currentMonth);
                const rangeStart = __range.start;
                return recurringPayments.map(payment => {
                    let paymentDate;
                    if (payment.dueDay >= 28) {
                        paymentDate = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), payment.dueDay);
                    } else {
                        paymentDate = new Date(rangeStart.getFullYear(), rangeStart.getMonth() + 1, payment.dueDay);
                    }
                    const daysUntil = Math.round((paymentDate.getTime() - todayMs) / 86400000);
                    const isPaid = paidPayments && paidPayments[`${monthKey}-${payment.id}`];
                    return { ...payment, paymentDate, daysUntil, isPaid };

                    {(() => {

                        const weekStart = new Date(today);
                        weekStart.setDate(today.getDate() - today.getDay());
                        weekStart.setHours(0,0,0,0);
                        const weekEnd = new Date(weekStart);
                        weekEnd.setDate(weekStart.getDate() + 6);
                        weekEnd.setHours(23,59,59,999);

                        const weeklyNonRecurringSpent = transactions
                            .filter(t => {
                                const d = parseLocalDate(t.date);
                                return t.type === 'expense' && !isRecurringTransaction(t) && !t.excludeFromBudget && d >= weekStart && d <= weekEnd;
                            })
                            .reduce((sum, t) => sum + parseFloat(t.amount), 0);

                        const monthlyNonRecurringSpent = transactions
                            .filter(t => {
                                const d = parseLocalDate(t.date);
                                return t.type === 'expense' && !isRecurringTransaction(t) && !t.excludeFromBudget && d >= start && d <= end;
                            })
                            .reduce((sum, t) => sum + parseFloat(t.amount), 0);

                        const monthlyBudget = weeklySpendingBudget * 4;
                        const weeklyRemaining = weeklySpendingBudget - weeklyNonRecurringSpent;
                        const monthlyRemaining = monthlyBudget - monthlyNonRecurringSpent;
                        const weeklyPct = Math.min((weeklyNonRecurringSpent / weeklySpendingBudget) * 100, 100);
                        const monthlyPct = Math.min((monthlyNonRecurringSpent / monthlyBudget) * 100, 100);

                                        <div style={{background:'#2d3748', borderRadius:'4px', height:'10px', overflow:'hidden', marginBottom:'8px'}}>
                                            <div style={{width:`${monthlyPct}%`, height:'100%', background:monthlyColor, transition:'width 0.3s ease'}}></div>
                                        </div>
                                        <div style={{display:'flex', justifyContent:'space-between', fontSize:'0.82em', color:'#a0aec0'}}>
                                            <span>Spent: <strong style={{color:'#e2e8f0'}}>{formatCurrency(monthlyNonRecurringSpent)}</strong></span>
                                            <span style={{color: monthlyColor, fontWeight:'700'}}>{monthlyPct.toFixed(0)}%</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                    {billsDueSoon.length > 0 && (

                                {billsDueSoon.map(p => {
                                    const monthKey = getMonthKey(currentMonth);
                                    const payKey = `${monthKey}-${p.id}`;
                                    const markPaid = () => {
                                        // Auto-pay: just mark paid — the useEffect will create the transaction when due
                                        if (p.auto) {
                                            setPaidPayments(prev => ({...prev, [payKey]: true}));
                                            return;
                                        }
                                        // Manual: create expense transaction and update linked debt, same as Recurring "Process"
                                        const newTransaction = { type: 'expense', amount: p.amount, description: `${p.name} (Recurring)`, category: p.category, date: getLocalDateString(), id: Date.now(), isRecurring: true };
                                        setTransactions(prev => [...prev, newTransaction]);
                                        setPaidPayments(prev => ({...prev, [payKey]: true}));
                                        if (p.linkedDebt) {
                                            setDebts(prev => prev.map(debt => {
                                                if (debt.id !== parseInt(p.linkedDebt)) return debt;
                                                const monthlyRate = (parseFloat(debt.interestRate) || 0) / 100 / 12;
                                                const interest = debt.currentBalance * monthlyRate;
                                                const principal = p.amount - interest;
                                                const newBalance = Math.max(0, debt.currentBalance - principal);
                                                return { ...debt, currentBalance: newBalance, transactionLog: [...(debt.transactionLog || []), { date: getLocalDateString(), paymentAmount: p.amount, interestAccrued: interest, principalPaid: principal, balanceBefore: debt.currentBalance, balanceAfter: newBalance }] };
                                            }));
                                        }
                                        showToast(`Payment processed: ${p.name} — ${formatCurrency(p.amount)}`);
                                    };

                                    <div key={p.id} style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#1a1f2e', padding: '14px 18px', borderRadius: '10px', borderLeft: `4px solid ${p.daysUntil === 0 ? '#dc3545' : p.daysUntil <= 2 ? '#ffc107' : '#667eea'}`, flexWrap: 'wrap', gap: '10px'}}>

                                            <div style={{color: '#e2e8f0', fontWeight: '600'}}>{p.name}</div>
                                            <div style={{color: '#a0aec0', fontSize: '0.85em', marginTop: '3px'}}>

                                        <div style={{display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap'}}>
                                            <span style={{color: '#ffc107', fontWeight: '700', fontSize: '1.15em'}}>{formatCurrency(p.amount)}</span>
                                            {p.paymentUrl && (
                                                <button onClick={() => window.open(p.paymentUrl, '_blank')} style={{padding: '6px 14px', fontSize: '0.85em', background: '#667eea'}}>Pay Now</button>
                                            )}
                                            <button onClick={markPaid} className="success" style={{padding: '6px 14px', fontSize: '0.85em'}}>✓ Mark Paid</button>
                                        </div>
                                    </div>
                                    );
                                })}

                            <div style={{marginTop: '12px', color: '#a0aec0', fontSize: '0.88em'}}>
                                Total due soon: <strong style={{color: '#ffc107'}}>{formatCurrency(billsDueSoon.reduce((s, p) => s + parseFloat(p.amount), 0))}</strong>
                            </div>
                        </div>

                    {transactions.length > 0 && (
                        <div className="section">
                            <h2>Recent Transactions</h2>

                                {transactions.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5).map(t => (
                                    <div key={t.id} className={`transaction-item ${t.type}`}>
                                        <div className="item-details">
                                            <h4>{t.description}</h4>
                                            <p>
                                                {t.category} • {t.date}
                                                {t.notes && <span style={{color: '#a0aec0', marginLeft: '8px'}}>• {t.notes}</span>}
                                            </p>
                                        </div>
                                        <div className={`item-amount ${t.type === 'income' ? 'positive' : 'negative'}`}>
                                            {t.type === 'income' ? '+' : '-'}{formatCurrency(parseFloat(t.amount))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    {transactions.filter(t => {
                        const tDate = parseLocalDate(t.date);
                        return tDate >= start && tDate <= end && t.type === 'expense';
                    }).length > 0 && (
                        <div className="section">
                            <h2>💳 Spending by Category This Month</h2>
                            <div style={{marginTop: '20px'}}>
                                {(() => {
                                    const categoryTotals = {};
                                    transactions.filter(t => {
                                        const tDate = parseLocalDate(t.date);
                                        return tDate >= start && tDate <= end && t.type === 'expense';
                                    }).forEach(t => {
                                        categoryTotals[t.category] = (categoryTotals[t.category] || 0) + parseFloat(t.amount);
                                    });
                                    
                                    const totalSpent = Object.values(categoryTotals).reduce((sum, val) => sum + val, 0);
                                    const sortedCategories = Object.entries(categoryTotals).sort((a, b) => b[1] - a[1]).slice(0, 8);
                                    
                                    return sortedCategories.map(([category, amount]) => {
                                        const percentage = (amount / totalSpent) * 100;
                                        return (
                                            <div key={category} style={{marginBottom: '15px'}}>

                                                    <span style={{color: '#e2e8f0', fontWeight: '600'}}>{category}</span>
                                                    <span style={{color: '#667eea', fontWeight: '700', fontSize: '1.1em'}}>{formatCurrency(amount)}</span>
                                                </div>
                                                <div style={{display: 'flex', alignItems: 'center', gap: '10px'}}>
                                                    <div style={{flex: 1, height: '12px', background: '#2d3748', borderRadius: '6px', overflow: 'hidden'}}>
                                                        <div style={{width: `${percentage}%`, height: '100%', background: 'linear-gradient(90deg, #667eea, #764ba2)', transition: 'width 0.3s ease'}}></div>
                                                    </div>
                                                    <span style={{color: '#a0aec0', fontSize: '0.9em', minWidth: '45px', textAlign: 'right'}}>{percentage.toFixed(1)}%</span>
                                                </div>
                                            </div>
                                        );
                                    });
                                })()}
                            </div>
                        </div>
                    )}

                            .filter(t => { const d = parseLocalDate(t.date); return t.type === 'expense' && !isRecurringTransaction(t) && !t.excludeFromBudget && d >= start && d <= end; })
                            .reduce((s, t) => s + parseFloat(t.amount), 0);

                        const monthPct = Math.min((monthTotalSpent / monthlyBudgetDash) * 100, 100);

                                <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:'16px', flexWrap:'wrap', gap:'8px'}}>

                                        </div>
                                        <div style={{display:'flex', justifyContent:'space-between', fontSize:'0.78em', color:'#a0aec0'}}>
                                            <span>{monthPct.toFixed(0)}% used</span>
                                            {monthOver ? <span style={{color:'#dc3545', fontWeight:'700'}}>OVER BUDGET</span> : <span style={{color:monthColor, fontWeight:'600'}}>{formatCurrency(monthRemaining)} left</span>}
                                        </div>
                                    </div>
                                </div>
                                <div style={{display:'flex', flexDirection:'column', gap:'10px'}}>
                                    {weeks.map((wk, i) => {
                                        const spent = transactions
                                            .filter(t => { const d = parseLocalDate(t.date); return t.type === 'expense' && !isRecurringTransaction(t) && !t.excludeFromBudget && d >= wk.effectiveStart && d <= wk.effectiveEnd; })
                                            .reduce((s, t) => s + parseFloat(t.amount), 0);
                                        const isCurrentWeek = today >= wk.weekStart && today <= wk.weekEnd;
                                        const isFuture = wk.weekStart > today;
                                        const isPast = wk.weekEnd < today;
                                        const over = spent > weeklySpendingBudget;
                                        const pct = Math.min((spent / weeklySpendingBudget) * 100, 100);
                                        const color = over ? '#dc3545' : pct >= 75 ? '#ffc107' : '#28a745';
                                        const remaining = weeklySpendingBudget - spent;
                                        const wLabel = `${wk.effectiveStart.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${wk.effectiveEnd.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
                                        return (
                                            <div key={i} onClick={() => !isFuture && setWeekTxModal({ effectiveStart: wk.effectiveStart, effectiveEnd: wk.effectiveEnd, wLabel, weekNum: i+1 })} style={{background:'#1a1f2e', borderRadius:'10px', padding:'14px 18px', border:`2px solid ${isCurrentWeek ? '#667eea' : over && isPast ? '#dc354540' : '#2d3748'}`, cursor: isFuture ? 'default' : 'pointer'}}>
                                                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'8px', flexWrap:'wrap', gap:'6px'}}>

                                                        {isFuture && <span style={{background:'#2d374888', color:'#718096', padding:'2px 8px', borderRadius:'8px', fontSize:'0.75em', fontWeight:'700'}}>UPCOMING</span>}

                                                        {isPast && !over && <span style={{background:'#28a74522', color:'#28a745', padding:'2px 8px', borderRadius:'8px', fontSize:'0.75em', fontWeight:'700'}}>✓ {formatCurrency(remaining)} under</span>}

                                {(() => {
                                    const txs = transactions.filter(t => {
                                        const d = parseLocalDate(t.date);
                                        return t.type === 'expense' && !isRecurringTransaction(t) && !t.excludeFromBudget && d >= weekTxModal.effectiveStart && d <= weekTxModal.effectiveEnd;
                                    }).sort((a, b) => new Date(b.date) - new Date(a.date));
                                    if (txs.length === 0) return <p style={{color:'#a0aec0', textAlign:'center', padding:'20px 0'}}>No transactions this week.</p>;
                                    const total = txs.reduce((s, t) => s + parseFloat(t.amount), 0);
                                    return (
                                        <div>
                                            <div style={{marginBottom:'12px', padding:'10px 14px', background:'#0f1419', borderRadius:'8px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                                                <span style={{color:'#a0aec0', fontWeight:'600'}}>{txs.length} transaction{txs.length !== 1 ? 's' : ''}</span>
                                                <span style={{color:'#dc3545', fontWeight:'700', fontSize:'1.1em'}}>{formatCurrency(total)}</span>
                                            </div>
                                            <div style={{display:'flex', flexDirection:'column', gap:'8px'}}>
                                                {txs.map(t => (
                                                    <div key={t.id} style={{background:'#0f1419', borderRadius:'8px', padding:'12px 14px', borderLeft:'3px solid #dc3545', display:'flex', justifyContent:'space-between', alignItems:'center', gap:'10px', flexWrap:'wrap'}}>
                                                        <div>
                                                            <div style={{color:'#e2e8f0', fontWeight:'600'}}>{t.description}</div>
                                                            <div style={{color:'#a0aec0', fontSize:'0.85em', marginTop:'2px'}}>{t.category} • {t.date}{t.notes ? ` • ${t.notes}` : ''}</div>
                                                        </div>
                                                        <div style={{color:'#dc3545', fontWeight:'700'}}>-{formatCurrency(parseFloat(t.amount))}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function TransactionsTab({ transactions, setTransactions, currentMonth, expenseCategories, incomeCategories, debts, setDebts }) {
            const [expandedMonths, setExpandedMonths] = useState({});
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchPlace, setSearchPlace] = useState('');
            const [editingTransaction, setEditingTransaction] = useState(null);
            const [bulkRows, setBulkRows] = useState([
                { id: 1, date: getLocalDateString(), description: '', amount: '', category: '', type: 'expense', notes: '', excludeFromBudget: false, linkedDebt: '' }
            ]);
            
            // Bulk select state
            const [bulkSelectMode, setBulkSelectMode] = useState(false);
            const [selectedIds, setSelectedIds] = useState(new Set());
            const [bulkCategory, setBulkCategory] = useState('');

            // Advanced filter states
            const [filterType, setFilterType] = useState('all'); // 'all', 'income', 'expense'
            const [filterRecurring, setFilterRecurring] = useState('all'); // 'all', 'recurring', 'non-recurring'
            const [dateFrom, setDateFrom] = useState('');
            const [dateTo, setDateTo] = useState('');
            const [amountMin, setAmountMin] = useState('');
            const [amountMax, setAmountMax] = useState('');
            const [showAdvancedFilters, setShowAdvancedFilters] = useState(false);


            // CSV Export Function
            const exportToCSV = (transactionsToExport) => {
                // CSV Header
                const headers = ['Date', 'Type', 'Vendor', 'Category', 'Amount', 'Linked Debt'];
                
                // CSV Rows
                const rows = transactionsToExport.map(t => {
                    const debtName = t.linkedDebt ? (debts.find(d => d.id === parseInt(t.linkedDebt))?.name || '') : '';
                    return [
                        t.date,
                        t.type,
                        `"${t.description}"`, // Quotes for descriptions with commas
                        t.category,
                        t.amount.toFixed(2),
                        debtName ? `"${debtName}"` : ''
                    ].join(',');
                });
                
                // Combine
                const csv = [headers.join(','), ...rows].join('\n');
                
                // Download
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `finance-transactions-${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
            };
            
            // Apply all filters
            const getFilteredTransactions = () => {
                return transactions.filter(t => {
                    // Type filter
                    if (filterType !== 'all' && t.type !== filterType) return false;

                    // Recurring filter
                    if (filterRecurring === 'recurring' && !isRecurringTransaction(t)) return false;
                    if (filterRecurring === 'non-recurring' && isRecurringTransaction(t)) return false;

                    // Category filter
                    if (selectedCategory !== 'All' && t.category !== selectedCategory) return false;
                    
                    // Search filter
                    if (searchPlace && !t.description.toLowerCase().includes(searchPlace.toLowerCase())) return false;
                    
                    // Date range filter
                    if (dateFrom) {
                        const tDate = parseLocalDate(t.date);
                        const fromDate = parseLocalDate(dateFrom);
                        if (tDate < fromDate) return false;
                    }
                    if (dateTo) {
                        const tDate = parseLocalDate(t.date);
                        const toDate = parseLocalDate(dateTo);
                        if (tDate > toDate) return false;
                    }
                    
                    // Amount range filter
                    if (amountMin && parseFloat(t.amount) < parseFloat(amountMin)) return false;
                    if (amountMax && parseFloat(t.amount) > parseFloat(amountMax)) return false;
                    
                    return true;
                });
            };
            
            const clearFilters = () => {
                setFilterType('all');
                setFilterRecurring('all');
                setSelectedCategory('All');
                setSearchPlace('');
                setDateFrom('');
                setDateTo('');
                setAmountMin('');
                setAmountMax('');
            };

            const addBulkRow = (inheritFrom) => {
                const last = inheritFrom || bulkRows[bulkRows.length - 1];
                setBulkRows(prev => [...prev, {
                    id: Date.now(),
                    date: last.date,
                    description: '',
                    amount: '',
                    category: last.category,
                    type: last.type,
                    notes: '',
                    excludeFromBudget: false,
                    linkedDebt: ''
                }]);
            };

            const removeBulkRow = (id) => {
                if (bulkRows.length > 1) {
                    setBulkRows(bulkRows.filter(row => row.id !== id));
                }
            };

            const updateBulkRow = (id, field, value) => {
                setBulkRows(prev => {
                    const updated = prev.map(row => row.id === id ? { ...row, [field]: value } : row);
                    const lastRow = prev[prev.length - 1];
                    if (lastRow.id === id && field === 'description' && !lastRow.description && value) {
                        const fromRow = updated[updated.length - 1];
                        updated.push({ id: Date.now(), date: fromRow.date, description: '', amount: '', category: fromRow.category, type: fromRow.type, notes: '', excludeFromBudget: false, linkedDebt: '' });
                    }
                    return updated;
                });
            };

            const handleBulkSubmit = (e) => {
                e.preventDefault();
                const validRows = bulkRows.filter(row => row.description && row.amount && row.category);

                if (validRows.length === 0) {
                    alert('Please fill out at least one complete transaction (description, amount, and category).');
                    return;
                }

                const newTransactions = validRows.map(row => ({
                    type: row.type,
                    amount: parseFloat(row.amount),
                    description: row.description,
                    category: row.category,
                    date: row.date,
                    notes: row.notes || '',
                    excludeFromBudget: row.excludeFromBudget || false,
                    linkedDebt: row.linkedDebt || '',
                    id: Date.now() + Math.random()
                }));

                setTransactions([...transactions, ...newTransactions]);

                // Process debt updates for rows linked to a debt
                const debtMap = {};
                validRows.forEach(row => {
                    if (row.linkedDebt && row.type === 'expense') {
                        const debtId = parseInt(row.linkedDebt);
                        const base = debtMap[debtId] || debts.find(d => d.id === debtId);
                        if (!base) return;
                        const paymentAmount = parseFloat(row.amount);
                        const lastPaymentDate = base.transactionLog && base.transactionLog.length > 0
                            ? new Date(base.transactionLog[base.transactionLog.length - 1].date)
                            : new Date(base.lastUpdated || row.date);
                        const currentDate = parseLocalDate(row.date);
                        const daysSinceLastPayment = Math.max(1, Math.floor((currentDate - lastPaymentDate) / (1000 * 60 * 60 * 24)));
                        const dailyRate = (parseFloat(base.interestRate) || 0) / 100 / 365;
                        const interestAccrued = base.currentBalance * dailyRate * daysSinceLastPayment;
                        const principalPaid = Math.max(0, paymentAmount - interestAccrued);
                        const newBalance = Math.max(0, base.currentBalance - principalPaid);
                        debtMap[debtId] = {
                            ...base,
                            currentBalance: newBalance,
                            lastUpdated: row.date,
                            transactionLog: [...(base.transactionLog || []), { date: row.date, paymentAmount, interestAccrued, principalPaid, balanceBefore: base.currentBalance, balanceAfter: newBalance, daysSinceLastPayment }]
                        };
                    }
                });
                if (Object.keys(debtMap).length > 0) {
                    setDebts(debts.map(d => debtMap[d.id] || d));
                }

                setBulkRows([{ id: Date.now(), date: getLocalDateString(), description: '', amount: '', category: '', type: 'expense', notes: '', excludeFromBudget: false, linkedDebt: '' }]);

                showToast(`Added ${newTransactions.length} transaction${newTransactions.length !== 1 ? 's' : ''}`);
            };

            const handleEdit = (transaction) => {
                setEditingTransaction(transaction);
            };

            const handleUpdate = (updatedTransaction) => {
                setTransactions(transactions.map(t => t.id === updatedTransaction.id ? updatedTransaction : t));
                setEditingTransaction(null);
            };

            const deleteTransaction = (id) => setTransactions(transactions.filter(t => t.id !== id));

            const toggleSelect = (id) => setSelectedIds(prev => {
                const next = new Set(prev);
                next.has(id) ? next.delete(id) : next.add(id);
                return next;
            });
            const selectAll = (ids) => setSelectedIds(prev => new Set([...prev, ...ids]));
            const deselectAll = (ids) => setSelectedIds(prev => { const next = new Set(prev); ids.forEach(id => next.delete(id)); return next; });
            const clearSelection = () => { setSelectedIds(new Set()); setBulkSelectMode(false); setBulkCategory(''); };
            const applyBulkCategory = () => {
                if (!bulkCategory || selectedIds.size === 0) return;
                setTransactions(transactions.map(t => selectedIds.has(t.id) ? { ...t, category: bulkCategory } : t));
                showToast(`Updated category to "${bulkCategory}" for ${selectedIds.size} transaction${selectedIds.size !== 1 ? 's' : ''}`);
                clearSelection();
            };

            const toggleMonth = (monthKey) => setExpandedMonths(prev => ({ ...prev, [monthKey]: !prev[monthKey] }));
            const getAllCategories = () => { const categories = new Set(); transactions.forEach(t => { if (t.category) categories.add(t.category); }); return ['All', ...Array.from(categories).sort()]; };
            const groupTransactionsByMonth = () => {
                const grouped = {};
                const filteredTransactions = getFilteredTransactions(); // Use new filter function
                filteredTransactions.forEach(transaction => {
                    const date = parseLocalDate(transaction.date);
                    const day = date.getDate();
                    let financialMonth, financialYear;
                    if (day >= 28) { financialMonth = date.getMonth() + 1; financialYear = date.getFullYear(); if (financialMonth > 11) { financialMonth = 0; financialYear++; } } else { financialMonth = date.getMonth(); financialYear = date.getFullYear(); }
                    const monthKey = `${financialYear}-${String(financialMonth + 1).padStart(2, '0')}`;
                    const monthLabel = new Date(financialYear, financialMonth, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                    if (!grouped[monthKey]) { grouped[monthKey] = { label: monthLabel, transactions: [], income: 0, expenses: 0 }; }
                    grouped[monthKey].transactions.push(transaction);
                    const amount = parseFloat(transaction.amount) || 0;
                    if (transaction.type === 'income') { grouped[monthKey].income += amount; } else { grouped[monthKey].expenses += amount; }
                });
                return Object.entries(grouped).sort((a, b) => b[0].localeCompare(a[0]));
            };

            const categories = getAllCategories();
            
            const monthlyGroups = groupTransactionsByMonth();

            return (
                <div>
                    <div className="section">
                        <h2 style={{marginBottom: '20px'}}>Add Transactions</h2>
                        <form onSubmit={handleBulkSubmit}>
                                <p style={{color: '#a0aec0', fontSize: '0.88em', marginBottom: '12px', marginTop: '-8px'}}>Tip: typing a vendor on the last row auto-adds a new row. New rows inherit the date, type, and category from the row above.</p>
                                <div style={{overflowX: 'auto'}}>
                                    <table style={{width: '100%', borderCollapse: 'collapse', marginBottom: '12px', fontSize: '0.93em'}}>
                                        <thead>
                                            <tr style={{background: '#1a1f2e'}}>
                                                <th style={{padding: '8px 10px', textAlign: 'left', color: '#667eea', border: '1px solid #2d3748'}}>Type</th>
                                                <th style={{padding: '8px 10px', textAlign: 'left', color: '#667eea', border: '1px solid #2d3748'}}>Date</th>
                                                <th style={{padding: '8px 10px', textAlign: 'left', color: '#667eea', border: '1px solid #2d3748'}}>Vendor</th>
                                                <th style={{padding: '8px 10px', textAlign: 'left', color: '#667eea', border: '1px solid #2d3748'}}>Amount</th>
                                                <th style={{padding: '8px 10px', textAlign: 'left', color: '#667eea', border: '1px solid #2d3748'}}>Category</th>
                                                <th style={{padding: '8px 10px', textAlign: 'left', color: '#667eea', border: '1px solid #2d3748'}}>Notes</th>
                                                {debts.filter(d => !d.paidOff).length > 0 && <th style={{padding: '8px 10px', textAlign: 'left', color: '#667eea', border: '1px solid #2d3748', whiteSpace: 'nowrap'}}>💳 Linked Debt</th>}
                                                <th style={{padding: '8px 10px', textAlign: 'center', color: '#667eea', border: '1px solid #2d3748', whiteSpace: 'nowrap'}} title="Check to exclude this transaction from weekly/monthly budget totals">Skip Budget</th>
                                                <th style={{padding: '8px 10px', textAlign: 'center', color: '#667eea', border: '1px solid #2d3748', width: '50px'}}></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {bulkRows.map((row, idx) => {
                                                const isReady = row.description && row.amount && row.category;
                                                return (
                                                <tr key={row.id} style={{background: isReady ? '#0d1f0d' : '#0f1419'}}>
                                                    <td style={{padding: '5px 6px', border: '1px solid #2d3748'}}>
                                                        <select
                                                            value={row.type}
                                                            onChange={(e) => updateBulkRow(row.id, 'type', e.target.value)}
                                                            style={{width: '100%', padding: '5px'}}
                                                        >
                                                            <option value="expense">Expense</option>
                                                            <option value="income">Income</option>
                                                        </select>
                                                    </td>
                                                    <td style={{padding: '5px 6px', border: '1px solid #2d3748'}}>
                                                        <input
                                                            type="date"
                                                            value={row.date}
                                                            onChange={(e) => updateBulkRow(row.id, 'date', e.target.value)}
                                                            style={{width: '100%', padding: '5px'}}
                                                        />
                                                    </td>
                                                    <td style={{padding: '5px 6px', border: '1px solid #2d3748'}}>
                                                        <input
                                                            type="text"
                                                            value={row.description}
                                                            onChange={(e) => updateBulkRow(row.id, 'description', e.target.value)}
                                                            placeholder="Vendor name"
                                                            style={{width: '100%', padding: '5px'}}
                                                        />
                                                    </td>
                                                    <td style={{padding: '5px 6px', border: '1px solid #2d3748'}}>
                                                        <input
                                                            type="number"
                                                            step="0.01"
                                                            min="0"
                                                            value={row.amount}
                                                            onChange={(e) => updateBulkRow(row.id, 'amount', e.target.value)}
                                                            placeholder="0.00"
                                                            style={{width: '100%', padding: '5px'}}
                                                        />
                                                    </td>
                                                    <td style={{padding: '5px 6px', border: '1px solid #2d3748'}}>
                                                        <select
                                                            value={row.category}
                                                            onChange={(e) => updateBulkRow(row.id, 'category', e.target.value)}
                                                            style={{width: '100%', padding: '5px'}}
                                                        >
                                                            <option value="">Select...</option>
                                                            {(row.type === 'expense' ? expenseCategories : incomeCategories).map(cat =>
                                                                <option key={cat} value={cat}>{cat}</option>
                                                            )}
                                                        </select>
                                                    </td>
                                                    <td style={{padding: '5px 6px', border: '1px solid #2d3748'}}>
                                                        <input
                                                            type="text"
                                                            value={row.notes || ''}
                                                            onChange={(e) => updateBulkRow(row.id, 'notes', e.target.value)}
                                                            placeholder="Optional"
                                                            style={{width: '100%', padding: '5px'}}
                                                        />
                                                    </td>
                                                    {debts.filter(d => !d.paidOff).length > 0 && (
                                                        <td style={{padding: '5px 6px', border: '1px solid #2d3748'}}>
                                                            {row.type === 'expense' ? (
                                                                <select
                                                                    value={row.linkedDebt || ''}
                                                                    onChange={(e) => updateBulkRow(row.id, 'linkedDebt', e.target.value)}
                                                                    style={{width: '100%', padding: '5px'}}
                                                                >
                                                                    <option value="">None</option>
                                                                    {debts.filter(d => !d.paidOff).map(debt => (
                                                                        <option key={debt.id} value={debt.id}>{debt.name}</option>
                                                                    ))}
                                                                </select>
                                                            ) : <span style={{color:'#4a5568', display:'block', textAlign:'center'}}>—</span>}
                                                        </td>
                                                    )}
                                                    <td style={{padding: '5px 6px', border: '1px solid #2d3748', textAlign: 'center'}}>
                                                        <input
                                                            type="checkbox"
                                                            checked={row.excludeFromBudget || false}
                                                            onChange={(e) => updateBulkRow(row.id, 'excludeFromBudget', e.target.checked)}
                                                            title="Exclude from budget tracking"
                                                            style={{width: '18px', height: '18px', cursor: 'pointer', accentColor: '#ffc107'}}
                                                        />
                                                    </td>
                                                    <td style={{padding: '5px 6px', border: '1px solid #2d3748', textAlign: 'center'}}>
                                                        <button
                                                            type="button"
                                                            onClick={() => removeBulkRow(row.id)}
                                                            className="danger"
                                                            style={{padding: '4px 9px', fontSize: '0.85em'}}
                                                            disabled={bulkRows.length === 1}
                                                        >
                                                            ✕
                                                        </button>
                                                    </td>
                                                </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                                {(() => {
                                    const readyRows = bulkRows.filter(r => r.description && r.amount && r.category);
                                    const expTotal = readyRows.filter(r => r.type === 'expense').reduce((s, r) => s + parseFloat(r.amount || 0), 0);
                                    const incTotal = readyRows.filter(r => r.type === 'income').reduce((s, r) => s + parseFloat(r.amount || 0), 0);
                                    if (readyRows.length === 0) return null;
                                    return (
                                        <div style={{display: 'flex', gap: '20px', padding: '10px 14px', background: '#1a1f2e', borderRadius: '8px', marginBottom: '12px', fontSize: '0.9em', flexWrap: 'wrap'}}>
                                            <span style={{color: '#a0aec0'}}>{readyRows.length} row{readyRows.length !== 1 ? 's' : ''} ready</span>
                                            {expTotal > 0 && <span style={{color: '#dc3545'}}>Expenses: <strong>{formatCurrency(expTotal)}</strong></span>}
                                            {incTotal > 0 && <span style={{color: '#28a745'}}>Income: <strong>{formatCurrency(incTotal)}</strong></span>}
                                            {expTotal > 0 && incTotal > 0 && <span style={{color: incTotal - expTotal >= 0 ? '#28a745' : '#dc3545'}}>Net: <strong>{formatCurrency(incTotal - expTotal)}</strong></span>}
                                        </div>
                                    );
                                })()}
                                <div style={{display: 'flex', gap: '10px', marginTop: '4px'}}>
                                    <button type="button" onClick={() => addBulkRow()} className="secondary">+ Add Row</button>
                                    <button type="submit" disabled={bulkRows.filter(r => r.description && r.amount && r.category).length === 0}>
                                        💾 Save {bulkRows.filter(r => r.description && r.amount && r.category).length > 0 ? `${bulkRows.filter(r => r.description && r.amount && r.category).length} Transaction${bulkRows.filter(r => r.description && r.amount && r.category).length !== 1 ? 's' : ''}` : 'All'}
                                    </button>
                                </div>
                            </form>
                    </div>
                    <div className="section">
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', flexWrap: 'wrap', gap: '10px'}}>
                            <h2>Transaction History</h2>
                            <div style={{display: 'flex', gap: '10px', flexWrap: 'wrap'}}>
                                <button
                                    onClick={() => { setBulkSelectMode(m => !m); setSelectedIds(new Set()); setBulkCategory(''); }}
                                    style={{background: bulkSelectMode ? '#ffc107' : 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', color: bulkSelectMode ? '#1a1f2e' : 'white', fontWeight: '700'}}
                                >
                                    {bulkSelectMode ? '✕ Cancel Select' : '☑ Select'}

                                <button onClick={() => exportToCSV(getFilteredTransactions())} style={{background: '#28a745'}}>
                                    📊 Export Filtered to CSV

                                    📋 Export All to CSV
                                </button>

                        </div>

                        {bulkSelectMode && selectedIds.size > 0 && (
                            <div style={{display: 'flex', alignItems: 'center', gap: '12px', padding: '14px 18px', background: '#1a2040', border: '2px solid #667eea', borderRadius: '10px', marginBottom: '15px', flexWrap: 'wrap'}}>
                                <span style={{color: '#667eea', fontWeight: '700'}}>{selectedIds.size} selected</span>
                                <span style={{color: '#2d3748'}}>|</span>
                                <span style={{color: '#a0aec0', fontSize: '0.9em'}}>Set category:</span>

                                >
                                    <option value="">— pick a category —</option>

                                        <option key={cat} value={cat}>{cat}</option>

                                </select>

                        <div style={{marginBottom: '20px', padding: '20px', background: '#1a1f2e', borderRadius: '10px', border: '2px solid #667eea'}}>
                            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px'}}>
                                <h3 style={{color: '#667eea', margin: 0}}>🔍 Search & Filter</h3>
                                <div style={{display: 'flex', gap: '10px'}}>
                                    <button onClick={() => setShowAdvancedFilters(!showAdvancedFilters)} className="secondary" style={{fontSize: '0.9em'}}>

                                    </button>

                            {/* Basic Filters */}
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '15px'}}>

                            {/* Filter Results Summary */}
                            {(() => {

                                const yearlyExpenses = yearlyFiltered.filter(t => t.type === 'expense').reduce((s, t) => s + parseFloat(t.amount || 0), 0);
                                const yearlyIncome = yearlyFiltered.filter(t => t.type === 'income').reduce((s, t) => s + parseFloat(t.amount || 0), 0);

                                                {hasExpenses && (

                                                    </span>

                                                    <span style={{background: '#1a3a2a', color: '#4ade80', border: '1px solid #28a74555', padding: '3px 10px', borderRadius: '12px', fontSize: '0.9em', fontWeight: '700'}}>
                                                        Income: {formatCurrency(yearlyIncome)}
                                                    </span>
                                                )}
                                                {hasExpenses && hasIncome && (
                                                    <span style={{background: '#1a2040', color: '#93c5fd', border: '1px solid #667eea55', padding: '3px 10px', borderRadius: '12px', fontSize: '0.9em', fontWeight: '700'}}>
                                                        Net: {formatCurrency(yearlyIncome - yearlyExpenses)}
                                                    </span>
                                                )}
                                                <span style={{color: '#4a5568', fontSize: '0.8em'}}>({yearlyFiltered.length} transaction{yearlyFiltered.length !== 1 ? 's' : ''})</span>
                                            </div>

                                    </div>
                                );
                            })()}
                        </div>
                        <div className="category-filters" style={{display: 'none'}}>

                            {categories.map(category => (
                                <button key={category} className={`category-filter-btn ${selectedCategory === category ? 'active' : ''}`} onClick={() => setSelectedCategory(category)}>{category}</button>
                            ))}
                        </div>
                        {monthlyGroups.length === 0 ? (
                            <p style={{color: '#a0aec0', textAlign: 'center', padding: '20px'}}>No transactions {selectedCategory !== 'All' ? `in category "${selectedCategory}"` : 'yet'}.</p>
                        ) : (
                            monthlyGroups.map(([monthKey, data]) => {
                                const monthIds = data.transactions.map(t => t.id);
                                const allMonthSelected = monthIds.length > 0 && monthIds.every(id => selectedIds.has(id));
                                return (
                                <div key={monthKey} className="collapsible-section">
                                    <div className="collapsible-header" onClick={() => toggleMonth(monthKey)} style={{userSelect: 'none'}}>
                                        <div style={{display: 'flex', alignItems: 'center', gap: '12px'}}>
                                            {bulkSelectMode && (
                                                <input
                                                    type="checkbox"
                                                    checked={allMonthSelected}
                                                    onChange={e => { e.stopPropagation(); allMonthSelected ? deselectAll(monthIds) : selectAll(monthIds); }}
                                                    onClick={e => e.stopPropagation()}
                                                    style={{width: '18px', height: '18px', cursor: 'pointer', accentColor: '#667eea'}}
                                                />
                                            )}
                                            <div>
                                                <h3>{data.label}</h3>
                                                <p style={{fontSize: '0.9em', marginTop: '5px', opacity: 0.9}}>
                                                    {data.transactions.length} transaction{data.transactions.length !== 1 ? 's' : ''} •
                                                    Income: {formatCurrency(data.income)} •
                                                    Expenses: {formatCurrency(data.expenses)} •
                                                    Net: <span style={{color: '#e2e8f0', fontWeight: '600'}}>
                                                        {formatCurrency(data.income - data.expenses)}
                                                    </span>
                                                </p>
                                            </div>
                                        </div>
                                        <div style={{fontSize: '1.5em'}}>{expandedMonths[monthKey] ? '▼' : '▶'}</div>
                                    </div>
                                    {expandedMonths[monthKey] && (
                                        <div className="collapsible-content">
                                            <div className="transaction-list">
                                                {[...data.transactions].sort((a, b) => new Date(b.date) - new Date(a.date)).map((transaction) => (
                                                    <div key={transaction.id} className={`transaction-item ${transaction.type}`}
                                                        style={selectedIds.has(transaction.id) ? {outline: '2px solid #667eea', outlineOffset: '-2px'} : {}}>
                                                        {bulkSelectMode && (
                                                            <input
                                                                type="checkbox"
                                                                checked={selectedIds.has(transaction.id)}
                                                                onChange={() => toggleSelect(transaction.id)}
                                                                style={{width: '18px', height: '18px', cursor: 'pointer', accentColor: '#667eea', flexShrink: 0, marginRight: '4px'}}
                                                            />
                                                        )}
                                                        <div className="item-details">
                                                            <h4>{transaction.description}{transaction.excludeFromBudget && <span style={{background:'#ffc10722', color:'#ffc107', border:'1px solid #ffc10755', padding:'2px 8px', borderRadius:'10px', fontSize:'0.72em', fontWeight:'700', marginLeft:'8px', verticalAlign:'middle'}}>Excl. Budget</span>}</h4>
                                                            <p>
                                                                {transaction.category} • {transaction.date}
                                                                {transaction.notes && <span style={{color: '#a0aec0', marginLeft: '8px'}}>• {transaction.notes}</span>}
                                                            </p>
                                                        </div>
                                                        <div style={{display: 'flex', alignItems: 'center', gap: '15px'}}>
                                                            <div className={`item-amount ${transaction.type === 'income' ? 'positive' : 'negative'}`}>{transaction.type === 'income' ? '+' : '-'}{formatCurrency(Math.abs(parseFloat(transaction.amount) || 0))}</div>
                                                            {!bulkSelectMode && <button onClick={() => handleEdit(transaction)} style={{padding: '8px 16px', fontSize: '0.9em'}}>Edit</button>}
                                                            {!bulkSelectMode && <button className="danger" onClick={() => deleteTransaction(transaction.id)} style={{padding: '8px 16px', fontSize: '0.9em'}}>Delete</button>}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                    </div>
                    {editingTransaction && <EditTransactionModal transaction={editingTransaction} onUpdate={handleUpdate} onClose={() => setEditingTransaction(null)} expenseCategories={expenseCategories} incomeCategories={incomeCategories} allUsedCategories={[...new Set(transactions.map(t => t.category).filter(Boolean))]} />}
                </div>
            );
