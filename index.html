        function EditTransactionModal({ transaction, onUpdate, onClose, expenseCategories, incomeCategories, allUsedCategories }) {
            const [formData, setFormData] = useState({ ...transaction });

            const handleSubmit = (e) => {
                e.preventDefault();
                onUpdate({ ...formData, amount: parseFloat(formData.amount) });
            };

            const categoryOptions = () => {
                const base = formData.type === 'expense' ? expenseCategories : incomeCategories;
                const extras = allUsedCategories.filter(c => !base.includes(c));
                return [...base, ...extras.sort()];
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <h2>Edit Transaction</h2>
                        <form onSubmit={handleSubmit}>
                            <div className="form-row">
                                <div className="form-group"><label>Type</label><select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})}><option value="income">Income</option><option value="expense">Expense</option></select></div>
                                <div className="form-group"><label>Amount</label><input type="number" step="0.01" value={formData.amount} onChange={(e) => setFormData({...formData, amount: e.target.value})} required /></div>
                                <div className="form-group"><label>Date</label><input type="date" value={formData.date} onChange={(e) => setFormData({...formData, date: e.target.value})} required /></div>
                            </div>
                            <div className="form-row">
                                <div className="form-group"><label>Vendor</label><input type="text" value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} required /></div>
                                <div className="form-group">
                                    <label>Category</label>
                                    <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})}>
                                        <option value="">Select category</option>
                                        {categoryOptions().map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div className="form-group">
                                <label>Notes (Optional)</label>
                                <input 
                                    type="text" 
                                    value={formData.notes || ''} 
                                    onChange={(e) => setFormData({...formData, notes: e.target.value})}
                                    placeholder="e.g., birthday gift, office supplies, etc."
                                />
                            </div>
                            <div className="form-group" style={{display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '20px'}}>
                                <input
                                    type="checkbox"
                                    id="editExcludeFromBudget"
                                    checked={formData.excludeFromBudget || false}
                                    onChange={(e) => setFormData({...formData, excludeFromBudget: e.target.checked})}
                                    style={{width: '18px', height: '18px', cursor: 'pointer', accentColor: '#ffc107', flexShrink: 0}}
                                />
                                <label htmlFor="editExcludeFromBudget" style={{cursor: 'pointer', color: '#a0aec0', marginBottom: 0, fontWeight: '600', fontSize: '0.9em'}}>
                                    Exclude from budget — debt payment or extra payment that shouldn't count against spending limits
                                </label>
                            </div>
                            <div style={{display: 'flex', gap: '10px', marginTop: '20px'}}>
                                <button type="submit">Save Changes</button>
                                <button type="button" className="secondary" onClick={onClose}>Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function PaymentCalendar({ recurringPayments, paidPayments, monthKey, currentMonth, togglePaidStatus, debts }) {
            const monthRange = getFinancialMonthRange(currentMonth);
            const start = monthRange.start;
            const startDay = start.getDate();
            const startMonth = start.getMonth();
            const startYear = start.getFullYear();
            
            // Generate calendar days for the financial month (28th to 27th)
            const totalAmount = recurringPayments.reduce((sum, p) => sum + parseFloat(p.amount), 0);
            const calendarDays = [];
            let runningTotal = 0;
            for (let i = 0; i < 30; i++) {
                const date = new Date(startYear, startMonth, startDay + i);
                const day = date.getDate();
                const paymentsOnDay = recurringPayments.filter(p => parseInt(p.dueDay) === day);
                runningTotal += paymentsOnDay.reduce((sum, p) => sum + parseFloat(p.amount), 0);

                calendarDays.push({
                    date: date,
                    day: day,
                    dayOfWeek: date.toLocaleDateString('en-US', { weekday: 'short' }),
                    monthName: date.toLocaleDateString('en-US', { month: 'short' }),
                    payments: paymentsOnDay,
                    isToday: new Date().toDateString() === date.toDateString(),
                    cumulativeTotal: runningTotal,
                    remainingAfterDay: totalAmount - runningTotal,
                    isSZCPayday: date.getDay() === 5,
                    isCICPayday: day === 1 || day === 16
                });
            }
            const paidAmount = recurringPayments.reduce((sum, p) => sum + (paidPayments[`${monthKey}-${p.id}`] ? parseFloat(p.amount) : 0), 0);
            const remainingAmount = totalAmount - paidAmount;

            return (
                <div style={{background: '#1a1f2e', padding: '20px', borderRadius: '10px', border: '2px solid #667eea'}}>
                    <h3 style={{color: '#667eea', marginBottom: '20px'}}>📅 Payment Calendar - {currentMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h3>
                    <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(120px, 1fr))', gap: '10px'}}>
                        {calendarDays.map((calDay, idx) => {
                            const hasPayments = calDay.payments.length > 0;
                            const allPaid = hasPayments && calDay.payments.every(p => paidPayments[`${monthKey}-${p.id}`]);
                            const somePaid = hasPayments && !allPaid && calDay.payments.some(p => paidPayments[`${monthKey}-${p.id}`]);
                            
                            return (
                                <div 
                                    key={idx}
                                    style={{
                                        background: calDay.isToday ? '#667eea22' : '#0f1419',
                                        border: `2px solid ${calDay.isToday ? '#667eea' : (hasPayments ? (allPaid ? '#28a745' : (somePaid ? '#ffc107' : '#dc3545')) : '#2d3748')}`,
                                        borderRadius: '8px',
                                        padding: '10px',
                                        minHeight: '100px',
                                        position: 'relative'
                                    }}
                                >
                                    <div style={{marginBottom: '8px', borderBottom: '1px solid #2d3748', paddingBottom: '5px'}}>
                                        <div style={{color: '#667eea', fontWeight: '600', fontSize: '0.85em'}}>{calDay.dayOfWeek}</div>
                                        <div style={{display: 'flex', alignItems: 'baseline', gap: '6px'}}>
                                            <div style={{color: '#e2e8f0', fontSize: '1.2em', fontWeight: '700'}}>{calDay.day}</div>
                                            {calDay.cumulativeTotal > 0 && <div style={{color: '#a0aec0', fontSize: '0.7em', fontWeight: '500'}}>{formatCurrency(calDay.cumulativeTotal)}</div>}
                                        </div>
                                        {calDay.cumulativeTotal > 0 && calDay.remainingAfterDay > 0 && <div style={{color: '#dc3545', fontSize: '0.7em', fontWeight: '500'}}>{formatCurrency(calDay.remainingAfterDay)} left</div>}
                                        <div style={{color: '#a0aec0', fontSize: '0.75em'}}>{calDay.monthName}</div>
                                    </div>
                                    
                                    {(calDay.isSZCPayday || calDay.isCICPayday) && (
                                        <div style={{display: 'flex', flexDirection: 'column', gap: '3px', marginBottom: '6px'}}>
                                            {calDay.isSZCPayday && (
                                                <div style={{background: '#1a3a1a', border: '1px solid #28a745', borderRadius: '4px', padding: '2px 5px', fontSize: '0.72em', color: '#28a745', fontWeight: '700', textAlign: 'center'}}>
                                                    💰 SZC Payday
                                                </div>
                                            )}
                                            {calDay.isCICPayday && (
                                                <div style={{background: '#1a2a3a', border: '1px solid #4da6ff', borderRadius: '4px', padding: '2px 5px', fontSize: '0.72em', color: '#4da6ff', fontWeight: '700', textAlign: 'center'}}>
                                                    💰 CIC Payday
                                                </div>
                                            )}
                                        </div>
                                    )}
                                    {calDay.payments.length === 0 ? (
                                        <div style={{color: '#4a5568', fontSize: '0.8em', fontStyle: 'italic'}}>No payments</div>
                                    ) : (
                                        <div style={{display: 'flex', flexDirection: 'column', gap: '5px'}}>
                                            {calDay.payments.map(payment => {
                                                const isPaid = paidPayments[`${monthKey}-${payment.id}`];
                                                const linkedDebt = payment.linkedDebt ? debts.find(d => d.id === parseInt(payment.linkedDebt)) : null;
                                                
                                                return (
                                                    <div 
                                                        key={payment.id}
                                                        style={{
                                                            background: isPaid ? '#28a74522' : '#dc354522',
                                                            border: `1px solid ${isPaid ? '#28a745' : '#dc3545'}`,
                                                            borderRadius: '5px',
                                                            padding: '6px',
                                                            fontSize: '0.75em',
                                                            cursor: 'pointer',
                                                            transition: 'all 0.2s'
                                                        }}
                                                        onClick={() => togglePaidStatus(payment.id)}
                                                        title={`Click to mark as ${isPaid ? 'unpaid' : 'paid'}`}
                                                    >
                                                        <div style={{display: 'flex', alignItems: 'center', gap: '4px', marginBottom: '3px'}}>
                                                            <span>{isPaid ? '✅' : '⭕'}</span>
                                                            <span style={{color: '#e2e8f0', fontWeight: '600', fontSize: '0.95em'}}>
                                                                {payment.name.length > 15 ? payment.name.substring(0, 15) + '...' : payment.name}
                                                            </span>
                                                        </div>
                                                        <div style={{color: isPaid ? '#28a745' : '#dc3545', fontWeight: '700'}}>
                                                            {formatCurrency(payment.amount)}
                                                        </div>
                                                        {linkedDebt && (
                                                            <div style={{color: '#a0aec0', fontSize: '0.85em', marginTop: '2px'}}>
                                                                💳 {linkedDebt.name.length > 12 ? linkedDebt.name.substring(0, 12) + '...' : linkedDebt.name}
                                                            </div>
                                                        )}
                                                        {payment.auto && (
                                                            <div style={{color: '#667eea', fontSize: '0.85em', marginTop: '2px'}}>
                                                                🤖 Auto-pay
                                                            </div>
                                                        )}
                                                        {payment.paymentUrl && (
                                                            <div 
                                                                style={{color: '#667eea', fontSize: '0.85em', marginTop: '2px', cursor: 'pointer'}}
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    window.open(payment.paymentUrl, '_blank');
                                                                }}
                                                                title="Open payment link"
                                                            >
                                                                🔗 Payment Link
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                    
                    <div style={{marginTop: '15px', padding: '15px', background: '#0f1419', borderRadius: '8px', display: 'flex', gap: '15px', flexWrap: 'wrap'}}>
                        <div style={{flex: 1, minWidth: '130px', textAlign: 'center', padding: '10px', background: '#28a74511', borderRadius: '8px', border: '1px solid #28a74544'}}>
                            <div style={{color: '#a0aec0', fontSize: '0.78em', letterSpacing: '0.5px', marginBottom: '4px'}}>PAID SO FAR</div>
                            <div style={{color: '#28a745', fontSize: '1.4em', fontWeight: '700'}}>{formatCurrency(paidAmount)}</div>
                            <div style={{color: '#a0aec0', fontSize: '0.75em', marginTop: '4px'}}>of {formatCurrency(totalAmount)}</div>
                        </div>
                        <div style={{flex: 1, minWidth: '130px', textAlign: 'center', padding: '10px', background: '#dc354511', borderRadius: '8px', border: '1px solid #dc354544'}}>
                            <div style={{color: '#a0aec0', fontSize: '0.78em', letterSpacing: '0.5px', marginBottom: '4px'}}>REMAINING</div>
                            <div style={{color: '#dc3545', fontSize: '1.4em', fontWeight: '700'}}>{formatCurrency(remainingAmount)}</div>
                            <div style={{color: '#a0aec0', fontSize: '0.75em', marginTop: '4px'}}>{totalAmount > 0 ? ((remainingAmount / totalAmount) * 100).toFixed(0) : 0}% left to pay</div>
                        </div>
                    </div>

                    <div style={{marginTop: '10px', padding: '15px', background: '#0f1419', borderRadius: '8px'}}>
                        <h4 style={{color: '#667eea', marginBottom: '10px', fontSize: '0.95em'}}>Legend:</h4>
                        <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '10px', fontSize: '0.85em'}}>
                            <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                                <div style={{width: '20px', height: '20px', border: '2px solid #dc3545', borderRadius: '4px'}}></div>
                                <span style={{color: '#a0aec0'}}>Unpaid</span>
                            </div>
                            <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                                <div style={{width: '20px', height: '20px', border: '2px solid #28a745', borderRadius: '4px'}}></div>
                                <span style={{color: '#a0aec0'}}>All Paid</span>
                            </div>
                            <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                                <div style={{width: '20px', height: '20px', border: '2px solid #ffc107', borderRadius: '4px'}}></div>
                                <span style={{color: '#a0aec0'}}>Partially Paid</span>
                            </div>
                            <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                                <div style={{width: '20px', height: '20px', border: '2px solid #667eea', borderRadius: '4px', background: '#667eea22'}}></div>
                                <span style={{color: '#a0aec0'}}>Today</span>
                            </div>
                        </div>
                    </div>
                </div>
            );

        function RecurringTab({ recurringPayments, setRecurringPayments, debts, setDebts, transactions, setTransactions, paidPayments, setPaidPayments, currentMonth }) {
            const [formData, setFormData] = useState({ name: '', amount: '', category: '', dueDay: '1', linkedDebt: '', auto: false, paymentUrl: '' });
            const [editingPayment, setEditingPayment] = useState(null);
            const [viewMode, setViewMode] = useState('list'); // 'list' or 'calendar'
            const monthKey = getMonthKey(currentMonth);

            // Check if auto-pay should be marked as paid (due date has passed in financial month)
            const shouldAutoPayBePaid = (payment) => {
                if (!payment.auto) return false;
                const today = new Date();
                const currentDay = today.getDate();
                const __range = getFinancialMonthRange(currentMonth); const start = __range.start;
                
                // Create a date for the payment due day in the financial month
                let paymentDate;
                if (payment.dueDay >= 28) {
                    // Days 28-31 are at the START of the financial month (previous calendar month)
                    paymentDate = new Date(start.getFullYear(), start.getMonth(), payment.dueDay);
                } else {
                    // Days 1-27 are in the NEXT calendar month after start
                    paymentDate = new Date(start.getFullYear(), start.getMonth() + 1, payment.dueDay);
                }
                
                // Payment is paid if today >= payment date
                return today >= paymentDate;
            };

            const handleSubmit = (e) => { 
                e.preventDefault(); 
                if (formData.name && formData.amount) { 
                    const newPayment = { ...formData, amount: parseFloat(formData.amount), dueDay: parseInt(formData.dueDay), id: Date.now() };
                    setRecurringPayments([...recurringPayments, newPayment]); 
                    
                    // Auto-pay: mark as paid if due date has already passed this month
                    if (formData.auto && shouldAutoPayBePaid(newPayment)) {
                        const paymentKey = `${monthKey}-${newPayment.id}`;
                        setPaidPayments({...paidPayments, [paymentKey]: true});
                    }
                    
                    setFormData({ name: '', amount: '', category: '', dueDay: '1', linkedDebt: '', auto: false }); 
                } 
            };

            const deletePayment = (id) => setRecurringPayments(recurringPayments.filter(p => p.id !== id));
            
            const handleEdit = (payment) => {
                setEditingPayment(payment);
            };

            const handleUpdate = (updatedPayment) => {
                setRecurringPayments(recurringPayments.map(p => p.id === updatedPayment.id ? updatedPayment : p));
                setEditingPayment(null);
            };
            
            const processPayment = (payment) => {
                const paymentKey = `${monthKey}-${payment.id}`;
                const newTransaction = { type: 'expense', amount: payment.amount, description: `${payment.name} (Recurring)`, category: payment.category, date: getLocalDateString(), id: Date.now(), isRecurring: true };
                setTransactions([...transactions, newTransaction]);
                setPaidPayments({...paidPayments, [paymentKey]: true});
                
                if (payment.linkedDebt) {
                    setDebts(debts.map(debt => {
                        if (debt.id === parseInt(payment.linkedDebt)) {
                            const interestRate = parseFloat(debt.interestRate) || 0;
                            const monthlyInterestRate = interestRate / 100 / 12;
                            const interestAccrued = debt.currentBalance * monthlyInterestRate;
                            const principalPaid = payment.amount - interestAccrued;
                            const newBalance = Math.max(0, debt.currentBalance - principalPaid);
                            
                            const transactionLog = debt.transactionLog || [];
                            const logEntry = {
                                date: getLocalDateString(),
                                paymentAmount: payment.amount,
                                interestAccrued: interestAccrued,
                                principalPaid: principalPaid,
                                balanceBefore: debt.currentBalance,
                                balanceAfter: newBalance
                            };
                            
                            return {
                                ...debt, 
                                currentBalance: newBalance,
                                transactionLog: [...transactionLog, logEntry]
                            }; 
                        } 
                        return debt; 
                    })); 
                }
                showToast(`Payment processed: ${payment.name} — ${formatCurrency(payment.amount)}`);
            };

            const togglePaidStatus = (paymentId) => {
                const paymentKey = `${monthKey}-${paymentId}`;
                setPaidPayments(prevPaid => ({
                    ...prevPaid, 
                    [paymentKey]: !prevPaid[paymentKey]
                }));
            };

            return (
                <div>

                        <form onSubmit={handleSubmit}>

                                <div className="form-group"><label>Payment Name</label><input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} placeholder="e.g., Mortgage, Netflix" required /></div>
                                <div className="form-group"><label>Amount</label><input type="number" step="0.01" value={formData.amount} onChange={(e) => setFormData({...formData, amount: e.target.value})} placeholder="0.00" required /></div>
                            </div>
                            <div className="form-row">
                                <div className="form-group"><label>Category</label><input type="text" value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} placeholder="e.g., Housing, Entertainment" /></div>
                                <div className="form-group"><label>Due Day (1-31)</label><input type="number" min="1" max="31" value={formData.dueDay} onChange={(e) => setFormData({...formData, dueDay: e.target.value})} required /></div>
                                <div className="form-group"><label>Link to Debt (Optional)</label><select value={formData.linkedDebt} onChange={(e) => setFormData({...formData, linkedDebt: e.target.value})}><option value="">None</option>{debts.map(debt => (<option key={debt.id} value={debt.id}>{debt.name}</option>))}</select></div>
                            </div>
                            <div className="form-group">
                                <label>Payment Link (Optional)</label>
                                <input 
                                    type="url" 
                                    value={formData.paymentUrl || ''} 
                                    onChange={(e) => setFormData({...formData, paymentUrl: e.target.value})} 
                                    placeholder="https://example.com/pay"
                                />
                                <small style={{color: '#a0aec0', fontSize: '0.85em', marginTop: '5px', display: 'block'}}>Add direct link to payment website</small>
                            </div>
                            <div className="form-group" style={{marginBottom: '0'}}>
                                <label style={{display: 'flex', alignItems: 'center', cursor: 'pointer'}}>
                                    <input type="checkbox" checked={formData.auto} onChange={(e) => setFormData({...formData, auto: e.target.checked})} style={{width: 'auto', marginRight: '10px'}} />
                                    Auto-pay (mark as paid when due date passes)
                                </label>
                            </div>
                            <button type="submit" style={{marginTop: '20px'}}>Add Recurring Payment</button>
                        </form>
                    </div>
                    <div className="section">
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px'}}>
                            <div>
                                <h2>Recurring Payments ({recurringPayments.length})</h2>
                                <p style={{color: '#a0aec0', fontSize: '1.1em'}}>

                                </p>
                            </div>
                            <div style={{display: 'flex', gap: '10px'}}>
                                <button 
                                    onClick={() => setViewMode('list')} 
                                    className={viewMode === 'list' ? '' : 'secondary'}
                                    style={{fontSize: '0.9em'}}
                                >
                                    📋 List View
                                </button>
                                <button 
                                    onClick={() => setViewMode('calendar')} 
                                    className={viewMode === 'calendar' ? '' : 'secondary'}
                                    style={{fontSize: '0.9em'}}
                                >
                                    📅 Calendar View
                                </button>
                            </div>
                        </div>
                        
                        {viewMode === 'calendar' ? (
                            <PaymentCalendar 
                                recurringPayments={recurringPayments}
                                paidPayments={paidPayments}
                                monthKey={monthKey}
                                currentMonth={currentMonth}

                        <div className="payment-list">
                            {recurringPayments.length === 0 ? (

                            ) : (
                                [...recurringPayments].sort((a, b) => a.dueDay - b.dueDay).map((payment) => {
                                    const linkedDebt = payment.linkedDebt ? debts.find(d => d.id === parseInt(payment.linkedDebt)) : null;
                                    const isManuallyPaid = paidPayments[`${monthKey}-${payment.id}`];
                                    const isAutoPaid = payment.auto && shouldAutoPayBePaid(payment);
                                    const isPaid = isManuallyPaid || isAutoPaid;
                                    
                                    return (
                                        <div key={payment.id} className={`payment-item ${isPaid ? 'paid' : 'unpaid'}`}>
                                            <div className="item-details">
                                                <h4>
                                                    {payment.name}
                                                    {isPaid && <span className="paid-badge">✓ Paid</span>}
                                                    {payment.auto ? <span className="auto-badge">AUTO</span> : <span className="manual-badge">MANUAL</span>}
                                                </h4>
                                                <p>{payment.category} • Due: Day {payment.dueDay}{linkedDebt && ` • Linked to: ${linkedDebt.name}`}</p>
                                            </div>
                                            <div style={{display: 'flex', alignItems: 'center', gap: '15px'}}>
                                                <div className="item-amount negative">{formatCurrency(payment.amount)}</div>
                                                {payment.paymentUrl && (
                                                    <button 
                                                        onClick={() => window.open(payment.paymentUrl, '_blank')} 
                                                        style={{padding: '8px 16px', fontSize: '0.9em', background: '#667eea', color: 'white', border: '2px solid #667eea'}}
                                                    >
                                                        🔗 Payment Link
                                                    </button>

                                                {!isPaid && !payment.auto && <button onClick={() => processPayment(payment)} style={{padding: '8px 16px', fontSize: '0.9em'}}>Process</button>}
                                                {!payment.auto && <button className={isPaid ? 'secondary' : 'success'} onClick={() => togglePaidStatus(payment.id)} style={{padding: '8px 16px', fontSize: '0.9em'}}>{isPaid ? 'Mark Unpaid' : 'Mark Paid'}</button>}
                                                <button onClick={() => handleEdit(payment)} style={{padding: '8px 16px', fontSize: '0.9em'}}>Edit</button>

        function DuplicatesTab({ transactions, setTransactions, ignoredPairs, setIgnoredPairs }) {
            const [confidenceFilter, setConfidenceFilter] = useState('all');

            const duplicateGroups = useMemo(() => {
                const groups = [];
                const processed = new Set();

                transactions.forEach((t1, i) => {
                    if (processed.has(t1.id)) return;

                    const potentialDuplicates = [];

                    transactions.forEach((t2, j) => {
                        if (i >= j) return;
                        if (processed.has(t2.id)) return;

                        const pairKey = [t1.id, t2.id].sort().join('-');
                        if (ignoredPairs.has(pairKey)) return;

                        const sameVendor = t1.description.toLowerCase() === t2.description.toLowerCase();
                        const sameType = t1.type === t2.type;
                        if (!sameVendor || !sameType) return;

                        const amountDiff = Math.abs(parseFloat(t1.amount) - parseFloat(t2.amount));
                        const sameAmount = amountDiff < 0.01;
                        const date1 = parseLocalDate(t1.date);
                        const date2 = parseLocalDate(t2.date);
                        const daysDiff = Math.abs((date1 - date2) / (1000 * 60 * 60 * 24));

                        let confidence;
                        if (sameAmount && daysDiff === 0) {
                            confidence = 'high';
                        } else if (sameAmount && daysDiff <= 2) {
                            confidence = 'medium';
                        } else if (amountDiff <= 1 && daysDiff <= 3) {
                            confidence = 'low';
                        } else {
                            return;
                        }

                        potentialDuplicates.push({ transaction: t2, confidence, daysDiff, pairKey });
                    });

                    if (potentialDuplicates.length > 0) {
                        groups.push({ original: t1, duplicates: potentialDuplicates });
                        processed.add(t1.id);
                        potentialDuplicates.forEach(d => processed.add(d.transaction.id));
                    }
                });

                return groups;
            }, [transactions, ignoredPairs]);

            const confidenceCounts = useMemo(() => ({
                high:   duplicateGroups.filter(g => g.duplicates.some(d => d.confidence === 'high')).length,
                medium: duplicateGroups.filter(g => g.duplicates.some(d => d.confidence === 'medium')).length,
                low:    duplicateGroups.filter(g => g.duplicates.some(d => d.confidence === 'low')).length,
            }), [duplicateGroups]);

            const filteredGroups = useMemo(() => {
                if (confidenceFilter === 'all') return duplicateGroups;
                return duplicateGroups
                    .filter(g => g.duplicates.some(d => d.confidence === confidenceFilter))
                    .map(g => ({ ...g, duplicates: g.duplicates.filter(d => d.confidence === confidenceFilter) }));
            }, [duplicateGroups, confidenceFilter]);

            const deleteTransaction = (id) => {
                if (confirm('Delete this transaction?')) {
                    setTransactions(prev => prev.filter(t => t.id !== id));
                }
            };

            const markAsNotDuplicate = (pairKey) => {
                setIgnoredPairs(prev => new Set([...prev, pairKey]));
            };

            const confidenceColor = { high: '#dc3545', medium: '#ffc107', low: '#6c757d' };
            const confidenceLabel = { high: '⚠️ HIGH CONFIDENCE', medium: '⚡ MEDIUM CONFIDENCE', low: '💭 LOW CONFIDENCE' };

            const TransactionRow = ({ transaction, label, pairKey, confidence, daysDiff }) => (
                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'start', padding: '10px 0', borderTop: '1px solid #2d3748'}}>
                    <div style={{flex: 1}}>
                        <div style={{color: '#a0aec0', fontSize: '0.78em', fontWeight: '600', textTransform: 'uppercase', marginBottom: '3px'}}>{label}</div>
                        <div style={{color: '#e2e8f0', fontSize: '0.95em'}}>
                            📅 {transaction.date}
                            {daysDiff !== undefined && (
                                <span style={{marginLeft: '10px', color: confidenceColor[confidence], fontSize: '0.85em'}}>
                                    {daysDiff === 0 ? 'Same day' : `${daysDiff} day${daysDiff > 1 ? 's' : ''} apart`}
                                </span>
                            )}
                        </div>
                        <div style={{color: '#a0aec0', fontSize: '0.85em', marginTop: '2px'}}>
                            {formatCurrency(Math.abs(parseFloat(transaction.amount)))} • {transaction.category}
                        </div>
                        {transaction.notes && <div style={{color: '#a0aec0', fontSize: '0.82em', marginTop: '2px'}}>Note: {transaction.notes}</div>}
                    </div>
                    <div style={{display: 'flex', gap: '8px', marginLeft: '10px', flexShrink: 0}}>
                        <button className="danger" onClick={() => deleteTransaction(transaction.id)} style={{padding: '6px 12px', fontSize: '0.85em', whiteSpace: 'nowrap'}}>Delete</button>
                        {pairKey && <button className="secondary" onClick={() => markAsNotDuplicate(pairKey)} style={{padding: '6px 12px', fontSize: '0.85em', whiteSpace: 'nowrap'}}>Keep Both</button>}
                    </div>
                </div>
            );

            return (
                <div>
                    <div className="section">
                        <h2>🔍 Duplicate Detector</h2>
                        <p style={{color: '#a0aec0', marginBottom: '20px'}}>
                            Found <strong style={{color: '#667eea'}}>{filteredGroups.length}</strong> potential duplicate group{filteredGroups.length !== 1 ? 's' : ''}
                        </p>

                        <div style={{marginBottom: '20px'}}>
                            <label style={{display: 'block', marginBottom: '10px', color: '#e2e8f0'}}>Filter by Confidence:</label>
                            <div style={{display: 'flex', gap: '10px', flexWrap: 'wrap'}}>
                                {[
                                    { key: 'all',    label: `All (${duplicateGroups.length})`,           bg: undefined },
                                    { key: 'high',   label: `⚠️ High (${confidenceCounts.high})`,        bg: '#dc3545' },
                                    { key: 'medium', label: `⚡ Medium (${confidenceCounts.medium})`,    bg: '#ffc107' },
                                    { key: 'low',    label: `💭 Low (${confidenceCounts.low})`,          bg: '#6c757d' },
                                ].map(({ key, label, bg }) => (
                                    <button
                                        key={key}
                                        className={confidenceFilter === key ? '' : 'secondary'}
                                        onClick={() => setConfidenceFilter(key)}
                                        style={{fontSize: '0.9em', background: confidenceFilter === key ? bg : undefined}}
                                    >
                                        {label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {filteredGroups.length === 0 ? (
                            <div style={{textAlign: 'center', padding: '40px', background: '#1a1f2e', borderRadius: '10px', border: '2px solid #28a745'}}>
                                <div style={{fontSize: '3em', marginBottom: '10px'}}>✅</div>
                                <h3 style={{color: '#28a745', marginBottom: '10px'}}>No Duplicates Found!</h3>
                                <p style={{color: '#a0aec0'}}>Your transactions look clean.</p>
                            </div>
                        ) : (
                            <div>
                                {filteredGroups.map((group, groupIndex) => {
                                    const highestConfidence = group.duplicates.reduce((max, d) => {
                                        const order = { high: 3, medium: 2, low: 1 };
                                        return order[d.confidence] > order[max] ? d.confidence : max;
                                    }, 'low');

                                    return (
                                        <div key={groupIndex} style={{background: '#1a1f2e', padding: '20px', borderRadius: '10px', marginBottom: '20px', border: `2px solid ${confidenceColor[highestConfidence]}`}}>
                                            <div style={{color: confidenceColor[highestConfidence], fontWeight: 'bold', marginBottom: '12px', fontSize: '0.9em'}}>
                                                {confidenceLabel[highestConfidence]}
                                            </div>
                                            <h4 style={{color: '#667eea', marginBottom: '4px'}}>{group.original.description}</h4>

                                            <div style={{borderLeft: '3px solid #667eea', paddingLeft: '15px', marginTop: '12px'}}>
                                                <TransactionRow transaction={group.original} label="Original" />
                                                {group.duplicates.map((dup, dupIndex) => (
                                                    <TransactionRow
                                                        key={dupIndex}
                                                        transaction={dup.transaction}
                                                        label="Possible duplicate"
                                                        pairKey={dup.pairKey}
                                                        confidence={dup.confidence}
                                                        daysDiff={dup.daysDiff}
                                                    />
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    <div className="section" style={{background: '#1a1f2e', padding: '15px', borderRadius: '10px'}}>
                        <h4 style={{color: '#667eea', marginBottom: '10px'}}>How Duplicate Detection Works:</h4>
                        <ul style={{color: '#a0aec0', fontSize: '0.9em', lineHeight: '1.8'}}>
                            <li><strong style={{color: '#dc3545'}}>⚠️ High Confidence:</strong> Same vendor + exact amount + same date</li>
                            <li><strong style={{color: '#ffc107'}}>⚡ Medium Confidence:</strong> Same vendor + exact amount + within 2 days</li>
                            <li><strong style={{color: '#6c757d'}}>💭 Low Confidence:</strong> Same vendor + amount within $1 + within 3 days</li>
                        </ul>
                        <p style={{color: '#a0aec0', fontSize: '0.85em', marginTop: '10px', fontStyle: 'italic'}}>
                            💡 Tip: Click "Keep Both" if transactions aren't actually duplicates to hide them from this list.
                        </p>
                    </div>
                </div>
            );
        }

        function DebtsTab({ debts, setDebts, recurringPayments, setRecurringPayments }) {

        function DebtPayoffTrackerTab({ debts }) {
            const [strategy, setStrategy] = React.useState('avalanche');
            const [extraBudget, setExtraBudget] = React.useState('');
            const [expandedDebt, setExpandedDebt] = React.useState(null);
            const [excludedIds, setExcludedIds] = React.useState(new Set());

            const toggleDebt = (id) => setExcludedIds(prev => {
                const n = new Set(prev);
                n.has(id) ? n.delete(id) : n.add(id);
                return n;
            });

            const activeDebts = debts.filter(d => !d.paidOff && parseFloat(d.currentBalance) > 0.01);
            const paidOffDebts = debts.filter(d => d.paidOff);
            const totalOriginal = debts.reduce((s, d) => s + (parseFloat(d.originalBalance) || parseFloat(d.currentBalance) || 0), 0);
            const totalRemaining = activeDebts.reduce((s, d) => s + (parseFloat(d.currentBalance) || 0), 0);
            const totalPaid = totalOriginal - totalRemaining;
            const overallProgress = totalOriginal > 0 ? (totalPaid / totalOriginal * 100) : 0;
            const totalMin = activeDebts.reduce((s, d) => s + (parseFloat(d.minimumPayment) || 0), 0);
            const extra = parseFloat(extraBudget) || 0;

            const planDebts = activeDebts.filter(d => !excludedIds.has(d.id));
            const planMin = planDebts.reduce((s, d) => s + (parseFloat(d.minimumPayment) || 0), 0);

            const sortDebts = (strat) => {
                const list = planDebts.map(d => ({
                    id: d.id, name: d.name,
                    balance: parseFloat(d.currentBalance) || 0,
                    rate: parseFloat(d.interestRate) || 0,
                    min: parseFloat(d.minimumPayment) || 0
                }));
                if (strat === 'avalanche') return [...list].sort((a, b) => b.rate - a.rate);
                if (strat === 'snowball') return [...list].sort((a, b) => a.balance - b.balance);
                return list;
            };

            const simulate = (orderedList, extraMonthly) => {
                if (!orderedList.length) return null;
                let state = orderedList.map(d => ({ ...d, paidOffMonth: null, totalInterest: 0 }));
                let avail = extraMonthly;
                let month = 0;
                const yearSnaps = [];
                while (state.some(d => d.balance > 0.01) && month < 601) {
                    month++;
                    state = state.map(d => {
                        if (d.balance <= 0.01) return d;
                        const interest = d.balance * (d.rate / 100 / 12);
                        return { ...d, balance: d.balance + interest, totalInterest: d.totalInterest + interest };
                    });
                    const focusIdx = state.findIndex(d => d.balance > 0.01);
                    state = state.map((d, i) => {
                        if (d.balance <= 0.01) return d;
                        const pay = i === focusIdx ? Math.min(d.balance, d.min + avail) : Math.min(d.balance, d.min);
                        return { ...d, balance: Math.max(0, d.balance - pay) };
                    });
                    state = state.map(d => {
                        if (d.balance <= 0.01 && d.paidOffMonth === null) {
                            avail += d.min;
                            return { ...d, balance: 0, paidOffMonth: month };
                        }
                        return d;
                    });

                                    <div style={{display: 'flex', flexDirection: 'column', gap: '10px', marginBottom: '24px'}}>

                    {(() => {

                        weekEnd.setHours(23,59,59,999);

                        const weeklyNonRecurringSpent = transactions
                            .filter(t => { const d = parseLocalDate(t.date); return t.type === 'expense' && !isRecurringTransaction(t) && !t.excludeFromBudget && d >= weekStart && d <= weekEnd; })
                            .reduce((sum, t) => sum + parseFloat(t.amount), 0);

                        const monthlyNonRecurringSpent = transactions
                            .filter(t => { const d = parseLocalDate(t.date); return t.type === 'expense' && !isRecurringTransaction(t) && !t.excludeFromBudget && d >= start && d <= end; })
                            .reduce((sum, t) => sum + parseFloat(t.amount), 0);

                        const monthlyBudget = weeklySpendingBudget * 4;
                        const weeklyRemaining = weeklySpendingBudget - weeklyNonRecurringSpent;
                        const monthlyRemaining = monthlyBudget - monthlyNonRecurringSpent;
                        const weeklyPct = Math.min((weeklyNonRecurringSpent / weeklySpendingBudget) * 100, 100);
                        const monthlyPct = Math.min((monthlyNonRecurringSpent / monthlyBudget) * 100, 100);
                        const weeklyColor = weeklyPct >= 100 ? '#dc3545' : weeklyPct >= 75 ? '#ffc107' : '#28a745';

                        const weekLabel = `${weekStart.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${weekEnd.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;

        function HistoryTab({ transactions, recurringPayments, debts, weeklySpendingBudget }) {
            // Calculate ALL-TIME totals
            const allTimeIncome = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + parseFloat(t.amount), 0);
            const allTimeExpenses = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + parseFloat(t.amount), 0);
            const allTimeNet = allTimeIncome - allTimeExpenses;
            
            // Get available years from transactions
            const availableYears = [...new Set(transactions.map(t => {
                const date = parseLocalDate(t.date);
                return date.getFullYear();
            }))].sort((a, b) => b - a);
            
            // If no years, default to current year
            if (availableYears.length === 0) {
                availableYears.push(new Date().getFullYear());
            }
            
            const [selectedYear, setSelectedYear] = useState(availableYears[0]);
            const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth()); // 0-11, or -1 for "Full Year"

            // Generate month options for selected year
            const getAvailableMonths = () => {
                const months = [{value: -1, label: 'Full Year'}]; // Add Full Year option first
                const currentYear = new Date().getFullYear();
                const currentMonth = new Date().getMonth();
                
                for (let i = 0; i < 12; i++) {
                    // Only show months that have passed or current month
                    if (selectedYear < currentYear || (selectedYear === currentYear && i <= currentMonth)) {
                        months.push({
                            value: i,
                            label: new Date(selectedYear, i, 1).toLocaleDateString('en-US', { month: 'long' })
                        });
                    }
                }
                return months;
            };
            
            const availableMonths = getAvailableMonths();
            
            // Filter transactions for selected FINANCIAL month (28th-27th) OR full year
            const getMonthTransactions = () => {
                if (selectedMonth === -1) {
                    // Full Year: Get all transactions for the selected year
                    return transactions.filter(t => {
                        const date = parseLocalDate(t.date);
                        // Check if transaction falls within any financial month of this year
                        for (let month = 0; month < 12; month++) {
                            const testDate = new Date(selectedYear, month, 1);
                            const monthRange = getFinancialMonthRange(testDate);
                            if (date >= monthRange.start && date <= monthRange.end) {
                                return true;
                            }
                        }
                        return false;
                    });
                } else {
                    // Single month: Create a date for the 1st of the selected month
                    const selectedDate = new Date(selectedYear, selectedMonth, 1);
                    const monthRange = getFinancialMonthRange(selectedDate);
                    const start = monthRange.start;
                    const end = monthRange.end;
                    
                    return transactions.filter(t => {
                        const date = parseLocalDate(t.date);
                        return date >= start && date <= end;
                    });
                }
            };
            
            const monthTransactions = getMonthTransactions();
            
            // Detect recurring expense transactions by their tag (auto-pay sets isRecurring flag; manual pay uses "(Recurring)" suffix)
            const isRecurringExpense = (t) =>
                t.type === 'expense' && (
                    t.isRecurring === true ||
                    (t.description && (t.description.endsWith('(Recurring)') || t.description.endsWith('(Auto)')))
                );

            // Calculate totals for selected month
            const monthIncome = monthTransactions.filter(t => t.type === 'income').reduce((sum, t) => sum + parseFloat(t.amount), 0);
            const monthExpenses = monthTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + parseFloat(t.amount), 0);
            const monthRecurringExpenses = monthTransactions.filter(isRecurringExpense).reduce((sum, t) => sum + parseFloat(t.amount), 0);
            const monthNonRecurringExpenses = monthExpenses - monthRecurringExpenses;
            const monthNet = monthIncome - monthExpenses;
            
            // Get top 5 EXPENSES only
            const topTransactions = [...monthTransactions]

            // Calculate category breakdown
            const categoryTotals = {};
            monthTransactions.filter(t => t.type === 'expense').forEach(t => {

                categoryTotals[cat] = (categoryTotals[cat] || 0) + parseFloat(t.amount);

                                                <p style={{margin: '5px 0 0 0', fontSize: '0.9em', color: '#a0aec0'}}>{t.category} • {formatDate(t.date)}</p>

                                            color: t.type === 'income' ? '#28a745' : '#dc3545'
                                        }}>
                                            {t.type === 'income' ? '+' : '-'}{formatCurrency(t.amount)}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    
                    {/* Category Breakdown */}
                    {sortedCategories.length > 0 && (
                        <div className="section" style={{background: '#1a1f2e', border: '2px solid #667eea'}}>
                            <h2 style={{marginBottom: '20px', color: '#667eea'}}>📊 Spending by Category</h2>
                            <div style={{display: 'flex', flexDirection: 'column', gap: '15px'}}>
                                {sortedCategories.map(([cat, amount], index) => {
                                    const percentage = monthExpenses > 0 ? (amount / monthExpenses * 100) : 0;
                                    const colors = ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#00f2fe', '#43e97b', '#fa709a', '#fee140'];
                                    const color = colors[index % colors.length];
                                    
                                    return (
                                        <div key={cat} style={{
                                            background: '#0f1419',
                                            border: '2px solid #2d3748',
                                            borderRadius: '12px',
                                            padding: '20px',
                                            transition: 'all 0.2s'
                                        }}>
                                            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px'}}>
                                                <div style={{display: 'flex', alignItems: 'center', gap: '10px'}}>
                                                    <div style={{
                                                        width: '12px',
                                                        height: '12px',
                                                        borderRadius: '50%',
                                                        background: color
                                                    }}></div>
                                                    <span style={{fontSize: '1.1em', fontWeight: '600', color: '#e2e8f0'}}>{cat}</span>
                                                </div>
                                                <div style={{display: 'flex', alignItems: 'center', gap: '20px'}}>
                                                    <span style={{fontSize: '1.2em', fontWeight: '700', color: '#dc3545'}}>{formatCurrency(amount)}</span>
                                                    <span style={{fontSize: '1em', fontWeight: '600', color: '#667eea', minWidth: '60px', textAlign: 'right'}}>{percentage.toFixed(1)}%</span>

                                                    transition: 'width 0.5s ease'

                                            </div>

                    {/* Monthly Breakdown (Full Year Only) */}
                    {selectedMonth === -1 && monthTransactions.length > 0 && (
                        <div className="section" style={{background: '#1a1f2e', border: '2px solid #667eea'}}>

                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '15px'}}>
                                {(() => {

                                            const date = parseLocalDate(t.date);
                                            return date >= monthRange.start && date <= monthRange.end;
                                        });
                                        
                                        if (monthTrans.length > 0) {
                                            const income = monthTrans.filter(t => t.type === 'income').reduce((sum, t) => sum + parseFloat(t.amount), 0);

                                            const net = income - expenses;

                                            monthlyData.push({

                                    {label: 'Total Expenses', base: monthExpenses, cmp: cmpExpenses, higherIsBetter: false},

                                const baseCats = {}; monthTransactions.filter(t => t.type === 'expense').forEach(t => { baseCats[t.category] = (baseCats[t.category] || 0) + parseFloat(t.amount); });
                                const cmpCats = {}; cmpTrans.filter(t => t.type === 'expense').forEach(t => { cmpCats[t.category] = (cmpCats[t.category] || 0) + parseFloat(t.amount); });
                                const allCats = [...new Set([...Object.keys(baseCats), ...Object.keys(cmpCats)])].sort((a, b) => ((baseCats[b] || 0) + (cmpCats[b] || 0)) - ((baseCats[a] || 0) + (cmpCats[a] || 0)));

                                return (
                                    <>
                                        <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '15px', marginBottom: '25px'}}>

                                                const good = m.higherIsBetter ? delta >= 0 : delta <= 0;

                                                    <div key={m.label} style={{background: '#0f1419', padding: '18px', borderRadius: '10px', border: '1px solid #2d3748'}}>

                                                        <div style={{display: 'grid', gridTemplateColumns: '1fr auto 1fr', gap: '8px', alignItems: 'center'}}>
                                                            <div>
                                                                <div style={{color: '#667eea', fontSize: '0.78em', marginBottom: '4px'}}>{baseLabel}</div>
                                                                <div style={{color: '#e2e8f0', fontWeight: '700', fontSize: '1.25em'}}>{formatCurrency(m.base)}</div>
                                                            </div>
                                                            <div style={{textAlign: 'center', padding: '0 4px'}}>
                                                                <div style={{color: good ? '#28a745' : '#dc3545', fontWeight: '700', fontSize: '0.85em'}}>{delta >= 0 ? '▲' : '▼'}</div>
                                                                <div style={{color: good ? '#28a745' : '#dc3545', fontWeight: '700', fontSize: '0.9em'}}>{formatCurrency(Math.abs(delta))}</div>

                                                            <div style={{textAlign: 'right'}}>
                                                                <div style={{color: '#764ba2', fontSize: '0.78em', marginBottom: '4px'}}>{cmpLabel}</div>
                                                                <div style={{color: '#e2e8f0', fontWeight: '700', fontSize: '1.25em'}}>{formatCurrency(m.cmp)}</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {allCats.length > 0 && (
                                            <div>
                                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px', flexWrap: 'wrap', gap: '8px'}}>
                                                    <h3 style={{color: '#a0aec0', fontWeight: '600', fontSize: '0.95em', textTransform: 'uppercase', letterSpacing: '1px', margin: 0}}>Category Breakdown</h3>
                                                    <div style={{display: 'flex', gap: '14px', fontSize: '0.8em'}}>
                                                        <span style={{display: 'flex', alignItems: 'center', gap: '5px'}}><span style={{width: '10px', height: '10px', background: '#667eea', borderRadius: '2px', display: 'inline-block'}}></span><span style={{color: '#a0aec0'}}>{baseLabel}</span></span>
                                                        <span style={{display: 'flex', alignItems: 'center', gap: '5px'}}><span style={{width: '10px', height: '10px', background: '#764ba2', borderRadius: '2px', display: 'inline-block'}}></span><span style={{color: '#a0aec0'}}>{cmpLabel}</span></span>
                                                    </div>
                                                </div>
                                                <div style={{display: 'flex', flexDirection: 'column', gap: '8px'}}>
                                                    {allCats.map(cat => {

                                                        const cmp = cmpCats[cat] || 0;
                                                        const delta = base - cmp;

                                                                    </span>
                                                                </div>
                                                                <div style={{display: 'flex', gap: '6px', alignItems: 'center'}}>

                                                                </div>
                                                            </div>

                                            </div>

                                    </>

                            const histMonthRemaining = histMonthBudget - histMonthSpent;

                            const histMonthOver = histMonthSpent > histMonthBudget;
                            const histMonthColor = histMonthOver ? '#dc3545' : histMonthPct >= 75 ? '#ffc107' : '#28a745';
                            const isCurrentSelMonth = today >= mRange.start && today <= mRange.end;
                            return (

                                            <div style={{color:'#a0aec0', fontSize:'0.78em', textTransform:'uppercase', letterSpacing:'1px', marginBottom:'4px'}}>{isCurrentSelMonth ? 'Remaining' : histMonthOver ? 'Overspent' : 'Saved'}</div>

                                        </div>
                                        <div style={{width:'100%'}}>
                                            <div style={{background:'#2d3748', borderRadius:'4px', height:'8px', overflow:'hidden', marginBottom:'4px'}}>

                                            </div>
                                            <div style={{display:'flex', justifyContent:'space-between', fontSize:'0.78em', color:'#a0aec0'}}>
                                                <span>{histMonthPct.toFixed(0)}% used</span>
                                                {histMonthOver ? <span style={{color:'#dc3545', fontWeight:'700'}}>OVER BUDGET</span> : <span style={{color:histMonthColor, fontWeight:'600'}}>{isCurrentSelMonth ? `${formatCurrency(histMonthRemaining)} left` : `${formatCurrency(histMonthRemaining)} under budget`}</span>}
                                            </div>
                                        </div>
                                    </div>
                                    <div style={{display:'flex', flexDirection:'column', gap:'10px'}}>
                                        {weeks.map((wk, i) => {

                                                .reduce((s, t) => s + parseFloat(t.amount), 0);
                                            const isCurrentWeek = today >= wk.weekStart && today <= wk.weekEnd;
                                            const isFuture = wk.weekStart > today;
                                            const isPast = wk.weekEnd < today;
                                            const over = spent > weeklySpendingBudget;
                                            const pct = Math.min((spent / weeklySpendingBudget) * 100, 100);
                                            const color = over ? '#dc3545' : pct >= 75 ? '#ffc107' : '#28a745';
                                            const remaining = weeklySpendingBudget - spent;
                                            const wLabel = `${wk.effectiveStart.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${wk.effectiveEnd.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
                                            return (

                                                    </div>
                                                </div>

                                </div>
                            );

                            <strong>How it works:</strong> On the due date, a transaction is created automatically and the payment is marked as paid.<br/>
                            <strong>Best for:</strong> Bills that auto-pay from your account (Netflix, utilities, car payment, etc.)
                        </p>
                        
                        <h3 style={{marginTop: '20px', marginBottom: '10px', color: '#667eea'}}>💳 Linking Payments to Debts</h3>
                        <p style={{marginBottom: '10px', lineHeight: '1.6', color: '#a0aec0'}}>
                            <strong>What it does:</strong> Automatically updates debt balance and tracks interest/principal breakdown.<br/>
                            <strong>How to link:</strong> When adding/editing a recurring payment, select a debt from the "Link to Debt" dropdown.<br/>
                            <strong>What you get:</strong> Automatic balance updates + transaction history showing exactly how each payment reduces your debt.<br/>
                            <strong>Important:</strong> Add your debts FIRST before creating linked recurring payments.
                        </p>
                        
                        <h3 style={{marginTop: '20px', marginBottom: '10px', color: '#667eea'}}>🔍 Search Transactions by Place</h3>
                        <p style={{marginBottom: '10px', lineHeight: '1.6', color: '#a0aec0'}}>
                            <strong>Where:</strong> Go to <strong style={{color: '#667eea'}}>💳 Transactions</strong> tab → Use the search box at the top of Transaction History.<br/>
                            <strong>How it works:</strong> Type any place name (e.g., "7 Brew", "Kroger", "Amazon") to see all matching transactions.<br/>
                            <strong>Shows:</strong> Total spent at that place this month + all-time total.<br/>
                            <strong>Smart matching:</strong> Automatically handles variations like "7brew" vs "7 Brew" or "walmart" vs "Wal-Mart"
                        </p>
                        
                        <h3 style={{marginTop: '20px', marginBottom: '10px', color: '#667eea'}}>📊 Debt Transaction Logs</h3>
                        <p style={{marginBottom: '10px', lineHeight: '1.6', color: '#a0aec0'}}>
                            <strong>Where to find:</strong> Go to <strong style={{color: '#667eea'}}>📉 Debt Tracking</strong> tab → Click on a debt to expand → Scroll to "Transaction History".<br/>
                            <strong>What it shows:</strong> Date, payment amount, interest charged, principal paid, and balance before/after.<br/>
                            <strong>Note:</strong> Only shows for debts with linked recurring payments that have been processed.
                        </p>
                        
                        <h3 style={{marginTop: '20px', marginBottom: '10px', color: '#667eea'}}>📅 Financial Month (28th-27th Cycle)</h3>
                        <p style={{marginBottom: '10px', lineHeight: '1.6', color: '#a0aec0'}}>
                            <strong>How it works:</strong> Financial months run from the 28th of one month through the 27th of the next.<br/>
                            <strong>Example:</strong> December 2025 = Nov 28 through Dec 27.<br/>
                            <strong>Why:</strong> Aligns with common payday cycles where bills are due early in the calendar month.<br/>
                            <strong>All calculations:</strong> Dashboard stats, Budget tab, and recurring payments all use this cycle.
                        </p>
                        
                        <h3 style={{marginTop: '20px', marginBottom: '10px', color: '#667eea'}}>💾 Export & Import</h3>
                        <p style={{marginBottom: '10px', lineHeight: '1.6', color: '#a0aec0'}}>
                            <strong>Export:</strong> Creates a backup JSON file with all your data (transactions, debts, recurring payments, settings).<br/>
                            <strong>Import:</strong> Restores data from a backup file - can be done from Dashboard welcome screen or Settings tab.<br/>
                            <strong>Use case:</strong> Backup your data regularly, or move data between devices/browsers.<br/>
                            <strong>Workflow:</strong> Import → Make changes → Export to save. No auto-save!
                        </p>
                        
                        <p style={{marginTop: '30px', padding: '15px', background: '#1a1f2e', borderRadius: '8px', color: '#667eea', fontSize: '0.9em'}}>
                            <strong>💡 Pro Tip:</strong> Data is not saved between sessions. Export JSON before closing the page, then Import it next time to pick up where you left off.
                        </p>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<FinanceTracker />, document.getElementById('root'));
    </script>
</body>
</html>
